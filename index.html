      let bg='transparent',tx='',col='var(--t1)',sty='';
      if(p){if(p[1]==='oos'){bg='var(--oos)';tx='—';col='var(--t2)';}
        else{const b=bucket(numOf(p));bg=BCOL[b];tx=label(p);col=b===1?'var(--t2)':BTXT(b);}}
      h+=`<td class="c${a?' a':''}" data-id="${x.id}" data-d="${d}" style="background:${bg};color:${col}">${tx}</td>`;}
    h+='</tr>';}
  $('#matrix').innerHTML=h+'</tbody>';
}
$('#matrix').addEventListener('mousemove',e=>{const c=e.target.closest('td.c');if(!c){hideTip();return;}
  const x=D.items[+c.dataset.id],d=c.dataset.d,p=x.pos[d],a=x.act[d];
  showTip(e,`<b>${esc(x.art)}</b> · ${fmtD(d)}<br>${esc(x.q)}<br>Место: <b>${p?(p[1]==='oos'?'нет в наличии':label(p)):'не замеряли'}</b>${p?` <span style="opacity:.7">(${p[3]})</span>`:''}${p&&p[2]&&p[1]!=='oos'&&p[1]!=='out'?`<br><span style="opacity:.8">в таблице: ${esc(p[2])}</span>`:''}${a?`<br>Что делали: ${esc(a)}`:''}`);});
$('#matrix').addEventListener('mouseleave',hideTip);

function legend(view){
  $('#legend').innerHTML = view==='matrix'
    ? Object.entries(BNAME).reverse().map(([b,n])=>`<span><span class="sw" style="background:${BCOL[b]}"></span>${n}</span>`).join('')
      +`<span><span class="sw" style="background:var(--oos)"></span>нет в наличии</span><span><span class="dot"></span>в этот день что-то делали (наведи)</span>`
    : '<span>▲ — поднялись выше (номер места меньше), ▼ — опустились. Клик по строке — график и все действия.</span>';
}

// подробно
function openDet(id){
  const x=D.items[id]; $('#d-title').textContent=`${x.art} · ${x.q}`;
  $('#d-sub').textContent=`SKU ${x.sku}${x.name?' · '+x.name:''}`;
  const all=periodDates(); const first=all.findIndex(d=>x.pos[d]||x.act[d]); const dates=first<0?all:all.slice(first); const pts=dates.filter(d=>x.pos[d]).map(d=>({d,p:x.pos[d],v:numOf(x.pos[d])}));
  const W=Math.min(1040,innerWidth*0.88),H=320,m={l:46,r:16,t:14,b:46};
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=d=>m.l+(dates.length<2?iw/2:dates.indexOf(d)/(dates.length-1)*iw);
  const lg=v=>Math.log10(v), ys=v=>m.t+lg(v)/lg(OUTV)*ih;
  const ticks=[1,3,10,30,100,250,OUTV];
  let s=`<svg width="${W}" height="${H}" id="dsvg" style="display:block">`;
  ticks.forEach(t=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${ys(t)+4}" text-anchor="end" font-size="11" fill="var(--t3)">${t===OUTV?'вне':t}</text>`;});
  const step=Math.max(1,Math.ceil(dates.length/16));
  dates.forEach((d,i)=>{if(i%step===0)s+=`<text x="${xs(d)}" y="${H-m.b+16}" text-anchor="middle" font-size="11" fill="var(--t3)">${fmtD(d)}</text>`;
    if(x.act[d])s+=`<rect x="${xs(d)-3}" y="${H-m.b+24}" width="6" height="6" rx="1" fill="var(--warn)"/>`;});
  s+=`<rect x="${m.l}" y="${H-12}" width="7" height="7" rx="1" fill="var(--warn)"/><text x="${m.l+12}" y="${H-5}" font-size="11" fill="var(--t3)">дни, когда что-то делали (наведи на график)</text>`;
  // линия по сегментам (разрыв на «нет в наличии»)
  let seg=[];const segs=[];pts.forEach(o=>{if(o.v==null){if(seg.length)segs.push(seg);seg=[];}else seg.push(o);});if(seg.length)segs.push(seg);
  segs.forEach(sg=>{s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${sg.map(o=>xs(o.d)+','+ys(o.v)).join(' ')}"/>`;});
  pts.forEach(o=>{ if(o.v==null) s+=`<text x="${xs(o.d)}" y="${m.t+ih/2}" text-anchor="middle" font-size="10" fill="var(--t3)">нет</text>`;
    else s+=`<circle cx="${xs(o.d)}" cy="${ys(o.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;});
  s+=`<line id="cross" y1="${m.t}" y2="${m.t+ih}" stroke="var(--t3)" stroke-dasharray="3 3" visibility="hidden"/>`;
  s+=`<rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent" id="hit"/></svg>`;
  $('#d-chart').innerHTML=pts.length?s:'<div class="empty">Нет замеров за выбранный период</div>';
  const hit=$('#hit');
  if(hit){hit.onmousemove=e=>{const r=hit.getBoundingClientRect();const fx=(e.clientX-r.left)/iw;
      const d=dates[Math.max(0,Math.min(dates.length-1,Math.round(fx*(dates.length-1))))];
      const cr=$('#cross');cr.setAttribute('x1',xs(d));cr.setAttribute('x2',xs(d));cr.setAttribute('visibility','visible');
      const p=x.pos[d],a=x.act[d];
      showTip(e,`<b>${fmtD(d)}</b><br>Место: <b>${p?(p[1]==='oos'?'нет в наличии':label(p)):'не замеряли'}</b>${a?`<br>Что делали: ${esc(a)}`:''}`);};
    hit.onmouseleave=()=>{hideTip();$('#cross').setAttribute('visibility','hidden');};}
  const rows=[...new Set([...Object.keys(x.pos),...Object.keys(x.act)])].sort().reverse();
  $('#d-acts').innerHTML='<div class="h">Дата</div><div class="h">Место</div><div class="h">Откуда</div><div class="h">Что делали</div>'+
    rows.map(d=>{const p=x.pos[d];return `<div>${fmtD(d)}</div><div>${p?(p[1]==='oos'?'нет':label(p)):'—'}</div><div class="sub">${p?p[3]:''}</div><div>${esc(x.act[d]||'')}</div>`;}).join('');
  $('#det').style.display='flex';
}
$('#d-x').onclick=()=>$('#det').style.display='none';
$('#det').onclick=e=>{if(e.target.id==='det')$('#det').style.display='none';};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#det').style.display='none';});
document.addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(t&&!e.target.closest('#det'))openDet(+t.dataset.id);});

$('#dl').onclick=()=>{
  const st={q:$('#f-q').value,g:$('#f-g').value,p:$('#f-p').value,ch:$('#f-ch').checked,view,sortKey,sortDir};
  const html=SRC.replace('const D = ','const __ST = '+JSON.stringify(st).replace(/</g,'\\u003c')+';\nconst D = ');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
let view='table';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(z=>z.classList.toggle('on',z===b));render();});
['#f-q','#f-g','#f-p','#f-ch'].forEach(s=>$(s).addEventListener('input',render));
function render(){const L=filtered();kpis(L);
  $('#v-table').style.display=view==='table'?'':'none';$('#v-matrix').style.display=view==='matrix'?'':'none';

if(typeof __ST!=='undefined'){const t=__ST;
  $('#f-q').value=t.q;$('#f-g').value=t.g;$('#f-p').value=t.p;$('#f-ch').checked=t.ch;
  view=t.view;sortKey=t.sortKey;sortDir=t.sortDir;
  document.querySelectorAll('.tabs button').forEach(z=>z.classList.toggle('on',z.dataset.t===view));}
render();
</script></body></html>
